<el-card v-if="carer.id" class="card-custom" :body-style="{ padding: '0px' }">
    <router-link :to="{ name: 'profile-carer', params: { id: carer.id } }" class="image-link">
        <div class="image-container">
            <img :src="imageUrl" class="image" />
        </div>
    </router-link>
    <div class="info-container">
        <span class="info-label">Nombre: {{ carer.name }}</span><br>
        <span class="info-label">Ciudad de residencia: {{ carer.city }}</span><br>
        <span class="info-label">Formación: {{ carer.formation }}</span>
        <span class="info-label">Disponibilidad: {{ carer.work_day }}</span>
        <div>
            <router-link :to="{ name: 'profile-carer', params: { id: carer.id } }">
                <el-button class="btn btn-purple">Ver Perfil</el-button>
            </router-link>
        </div>
    </div>
</el-card>
