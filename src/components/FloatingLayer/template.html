<section class="barra-accesibilidad-flotante">
    <button @click="toggleOpciones" aria-label="Mostrar opciones de accesibilidad">
        <i class="fas fa-universal-access" aria-hidden="true"></i> <span class="sr-only">{{ desplegarTexto }} / {{
            cerrarTexto }}</span>
    </button>

    <div v-if="mostrarOpciones" class="opciones-accesibilidad">
        <button @click="cambiarFontSize('aumentar')" aria-label="Aumentar tamaño de fuente">
            <i class="fas fa-plus-circle" aria-hidden="true"></i> <span class="sr-only">Aumentar texto</span>
        </button>
        <button @click="cambiarFontSize('disminuir')" aria-label="Disminuir tamaño de fuente">
            <i class="fas fa-minus-circle" aria-hidden="true"></i> <span class="sr-only">Reducir texto</span>
        </button>
        <button :class="{ 'activo': contrast !== 'normal' }" @click="alternarContraste" aria-label="Alternar contraste">
            <i class="fas fa-adjust" aria-hidden="true"></i> <span class="sr-only">Alternar contraste</span>
        </button>
        <button :class="{ 'activo': grayscale }" @click="toggleGrayscale" aria-label="Alternar escala de grises">
            <i class="fas fa-tint-slash" aria-hidden="true"></i> <span class="sr-only">Alternar escala de grises</span>
        </button>
        <button :class="{ 'activo': underlineLinks }" @click="toggleUnderlineLinks"
            aria-label="Alternar subrayado de enlaces">
            <i class="fas fa-underline" aria-hidden="true"></i> <span class="sr-only">Alternar subrayado de
                enlaces</span>
        </button>
        <button :class="{ 'activo': readableFont }" @click="toggleReadableFont" aria-label="Alternar fuente legible">
            <i class="fas fa-font" aria-hidden="true"></i> <span class="sr-only">Alternar fuente legible</span>
        </button>
        <button :class="{ 'activo': daltonism !== 'normal' }" @click="alternarDaltonismo"
            aria-label="Alternar modo para daltonismo">
            <i class="fas fa-eye" aria-hidden="true"></i> <span class="sr-only">Alternar modo para daltonismo</span>
        </button>
        <div v-if="daltonism !== 'normal'" class="daltonism-options">
            <button :class="{ 'activo': daltonism === 'protanopia' }" @click="setDaltonism('protanopia')"
                aria-label="Modo Protanopia (rojo-verde)">
                <span class="sr-only">Protanopia</span>
                <div class="color-sample protanopia"></div>
            </button>
            <button :class="{ 'activo': daltonism === 'deuteranopia' }" @click="setDaltonism('deuteranopia')"
                aria-label="Modo Deuteranopia (rojo-verde)">
                <span class="sr-only">Deuteranopia</span>
                <div class="color-sample deuteranopia"></div>
            </button>
            <button :class="{ 'activo': daltonism === 'tritanopia' }" @click="setDaltonism('tritanopia')"
                aria-label="Modo Tritanopia (azul-amarillo)">
                <span class="sr-only">Tritanopia</span>
                <div class="color-sample tritanopia"></div>
            </button>
            <button @click="setDaltonism('normal')" aria-label="Desactivar modo para daltonismo">
                <i class="fas fa-times-circle" aria-hidden="true"></i> <span class="sr-only">Desactivar
                    daltonismo</span>
            </button>
        </div>
    </div>
</section>
