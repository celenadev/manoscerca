<main class="container-form">
    <form class="form-signin1" v-on:submit.prevent="validate">
        <h1>Envíame un Mensaje</h1>
        <div class="form-floating">
            <input v-model="name" id="name" type="text" class="form-control" placeholder="Nombre y Apellidos" name="name"/>
            <label for="name">Nombre y Apellidos</label>
            <div v-if="enviado && !$v.name.required" class="mensajeError">Debe escribir un nombre y apellidos</div>
        </div>
        <div class="form-floating">
            <textarea v-model="message" id="message" class="form-control" placeholder="Escribe tu mensaje aquí" name="message" rows="9"></textarea>
            <label for="message">Mensaje</label>
            <div v-if="enviado && !$v.message.required" class="mensajeError">Debe escribir un mensaje</div>
        </div>
        <button type="submit" class="btn w-100 py-2 btn-purple">Enviar</button>
    </form>
</main>
