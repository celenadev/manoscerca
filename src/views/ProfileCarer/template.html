<div class="container-profile">
    <div class="row-fila-one">
        <div class="image-container">
            <img src="../../../public/imagenes/junto-a-ti (6).jpg" class="image">
            <!-- <img :src="carer.imagen" class="image"> -->
        </div>
        <div class="info-carer">
            <div class="information-carer">
                <h1>{{ carer.name }}</h1>
                <p> {{ carer.city }}, {{ carer.address }}</p>
            </div>
            <div class="information-carer">
                <h2>Formación</h2>
                <p> {{ carer.formation }}</p>
            </div>
            <div class="information-carer">
                <h2>Experiencia</h2>
                <p> {{ carer.year }} años </p>
            </div>
            <div class="information-carer">
                <h2>Servicios de cuidados de Rocío</h2>
                <ul>
                    <li>{{ carer.help_type }}</li>
                </ul>
            </div>
            <div>
                <RouterLink to="/contact-form">
                    <el-button type="primary" class="btn-purple">Contactar</el-button>
                </RouterLink>
            </div>
        </div>
    </div>
    <div class="row-fila-two">
        <div>Similares</div>
    </div>
</div>
